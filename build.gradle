plugins {
	id 'fabric-loom' version '1.15.5'
	id 'maven-publish'
	id 'java'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
	}
	maven {
		name = 'MaxHenkel'
		url = 'https://maven.maxhenkel.de/releases'
	}
	maven {
		name = 'Xander Maven'
		url = 'https://maven.isxander.dev/releases'
	}
	maven {
		name = 'Datasync'
		url = 'https://maven.uuid.gg/releases'
	}
	maven {
		name = 'FzzyMaven'
		url = 'https://maven.fzzyhmstrs.me/'
	}
	maven {
		name = 'WispForest'
		url = 'https://maven.wispforest.io/releases'
	}
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
}

configurations {
	vendoredImmersivePortals {
		transitive = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modCompileOnly "dev.doctor4t:wathe:${project.wathe_version}"
	modCompileOnly "maven.modrinth:wathe-extended:${project.watheextended_version}"
	modCompileOnly "maven.modrinth:harpymodloader:${project.harpymodloader_version}"
	modCompileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${project.geckolib_version}"
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
	modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	modCompileOnly "maven.modrinth:iris:${project.iris_version}"
	modCompileOnly "maven.modrinth:immersiveportals:${project.immersive_portals_version}"
	vendoredImmersivePortals "maven.modrinth:immersiveportals:${project.immersive_portals_version}"

	modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
}

def licenseArchiveName = project.archives_base_name

jar {
	from("LICENSE") {
		rename { "${it}_${licenseArchiveName}" }
	}
	from("THIRD_PARTY_NOTICES.md") {
		into "META-INF"
		rename { "THIRD_PARTY_NOTICES_Gexpress.md" }
	}
	from("licenses") {
		into "META-INF/licenses"
	}
}

tasks.register('vendorImmersivePortalsIntoRemappedJar') {
	dependsOn remapJar
	inputs.files(configurations.vendoredImmersivePortals)
	outputs.upToDateWhen { false }

	doLast {
		def immersivePortalsJar = configurations.vendoredImmersivePortals.singleFile
		def jarFile = remapJar.archiveFile.get().asFile
		def tempDir = temporaryDir
		delete tempDir
		mkdir tempDir
		copy {
			from zipTree(jarFile)
			include 'fabric.mod.json'
			into tempDir
		}
		def fabricModJsonFile = file("${tempDir}/fabric.mod.json")
		def fabricModJson = new groovy.json.JsonSlurper().parse(fabricModJsonFile)
		fabricModJson.provides = ((fabricModJson.provides ?: []) + [
				'iportal',
				'imm_ptl_core',
				'immersive_portals_core'
		]).unique()
		fabricModJson.entrypoints.main = ((fabricModJson.entrypoints.main ?: []) + [
				'qouteall.imm_ptl.peripheral.platform_specific.PeripheralModEntry',
				'qouteall.imm_ptl.core.platform_specific.IPModEntry',
				'qouteall.q_misc_util.MiscUtilModEntry'
		]).unique()
		fabricModJson.entrypoints.client = ((fabricModJson.entrypoints.client ?: []) + [
				'qouteall.imm_ptl.peripheral.platform_specific.PeripheralModEntryClient',
				'qouteall.imm_ptl.core.platform_specific.IPModEntryClient',
				'qouteall.q_misc_util.MiscUtilModEntryClient'
		]).unique()
		fabricModJson.entrypoints.server = ((fabricModJson.entrypoints.server ?: []) + [
				'qouteall.imm_ptl.core.platform_specific.IPModEntryDedicatedServer'
		]).unique()
		fabricModJson.mixins = ((fabricModJson.mixins ?: []) + [
				'imm_ptl_peripheral.mixins.json',
				'imm_ptl.mixins.json',
				'imm_ptl_fabric.mixins.json',
				'imm_ptl_compat.mixins.json',
				'q_misc_util.mixins.json'
		]).unique()
		fabricModJson.accessWidener = 'imm_ptl.accesswidener'
		fabricModJson.jars = [
				[file: 'META-INF/jars/DimLib-v1.1.0-mc1.21.1.jar']
		]
		fabricModJson.custom = fabricModJson.custom ?: [:]
		fabricModJson.custom['fabric-renderer-indigo:force_compatibility'] = true
		fabricModJson.custom['lithium:options'] = [
				'mixin.world.player_chunk_tick'       : false,
				'mixin.world.combined_heightmap_update': false
		]
		fabricModJson.custom['dashloader:disableoption'] = ['CACHE_SHADER']
		fabricModJsonFile.text = groovy.json.JsonOutput.prettyPrint(
				groovy.json.JsonOutput.toJson(fabricModJson)
		)
		ant.zip(destfile: remapJar.archiveFile.get().asFile, update: true, duplicate: 'preserve') {
			zipfileset(src: immersivePortalsJar) {
				exclude(name: 'fabric.mod.json')
				exclude(name: 'META-INF/MANIFEST.MF')
				exclude(name: 'META-INF/*.SF')
				exclude(name: 'META-INF/*.DSA')
				exclude(name: 'META-INF/*.RSA')
				exclude(name: 'META-INF/jars/cloth-config-fabric-*.jar')
			}
			zipfileset(dir: tempDir) {
				include(name: 'fabric.mod.json')
			}
		}
	}
}

tasks.named('assemble') {
	dependsOn tasks.named('vendorImmersivePortalsIntoRemappedJar')
}

tasks.named('build') {
	dependsOn tasks.named('vendorImmersivePortalsIntoRemappedJar')
}

def modrinthMods = file(System.getenv('APPDATA') ?: "${System.getProperty('user.home')}/AppData/Roaming")
		.toPath()
		.resolve('ModrinthApp/profiles/The Harpy Express_ Extended/mods')
		.toFile()

tasks.register('copyToModrinth', Copy) {
	dependsOn tasks.named('vendorImmersivePortalsIntoRemappedJar')
	from remapJar.archiveFile
	into modrinthMods
	doFirst {
		if (!modrinthMods.isDirectory()) {
			logger.warn("[copyToModrinth] target dir missing: ${modrinthMods}")
			throw new StopExecutionException("Modrinth mods dir not found")
		}
		def profileMarker = 'modrinthapp/profiles/the harpy express_ extended'
		def minecraftProcesses = ProcessHandle.allProcesses()
				.findAll { it.pid() != ProcessHandle.current().pid() }
				.findAll {
					def cmd = it.info().commandLine().orElse('').toLowerCase(Locale.ROOT).replace('\\', '/')
					cmd.contains(profileMarker)
							|| cmd.contains('net.minecraft.client.main.main')
							|| cmd.contains('net.fabricmc.loader.impl.launch.knot.knotclient')
							|| cmd.contains('net.fabricmc.loader.impl.launch.knot.knotserver')
				}
				.collect { it.pid() }
		if (!minecraftProcesses.isEmpty()) {
			throw new StopExecutionException("Close Minecraft/the server before copying Gexpress. Running Java process ids: ${minecraftProcesses}")
		}
	}
	doLast {
		logger.lifecycle("[copyToModrinth] copied ${remapJar.archiveFile.get()} -> ${modrinthMods}")
	}
}

if (project.findProperty('deployToModrinth') == 'true') {
	build.finalizedBy tasks.named('copyToModrinth')
}
